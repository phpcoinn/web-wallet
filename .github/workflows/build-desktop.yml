name: Desktop builds (Windows & Linux)

permissions:
  contents: write

# Tags only (+ manual): avoids duplicate runs when you push master then a tag
# (or `git push origin master v*`) — both would otherwise trigger this workflow.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Windows artifacts
        working-directory: electron
        run: npm run dist:win:x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phpcoin-wallet-windows-x64
          path: |
            electron/release/*.exe
            electron/release/*.yml
          if-no-files-found: error

  build-linux:
    name: Linux x64 (AppImage & deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 fakeroot rpm

      - name: Install root dependencies
        run: npm ci

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Linux artifacts
        working-directory: electron
        run: npm run dist:linux:x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phpcoin-wallet-linux-x64
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: phpcoin-wallet-windows-x64
          path: staged/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: phpcoin-wallet-linux-x64
          path: staged/linux

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staged/win/*
            staged/linux/*
          generate_release_notes: true
